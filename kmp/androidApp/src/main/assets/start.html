<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sledge</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0c0e;
      color: #f3f3f1;
      font-family: system-ui, sans-serif;
    }
    main { width: min(480px, calc(100% - 40px)); }
    .mark {
      width: 44px;
      height: 44px;
      border-radius: 2px;
      background: #d4652f;
      color: #0c0c0e;
      display: grid;
      place-items: center;
      font-weight: 750;
      font-size: 22px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-weight: 560;
      font-size: 42px;
      letter-spacing: -0.03em;
    }
    p {
      margin: 8px 0 28px;
      color: #b5b5b0;
      line-height: 1.45;
    }
    form {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #161618;
      border-radius: 2px;
      padding: 6px 6px 6px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }
    input {
      flex: 1;
      border: 0;
      background: transparent;
      color: #f3f3f1;
      font-size: 16px;
      padding: 10px 0;
    }
    input:focus { outline: none; }
    button {
      border: 0;
      border-radius: 2px;
      background: #d4652f;
      color: #0c0c0e;
      font-weight: 700;
      padding: 10px 16px;
    }
    .dials {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }
    a {
      color: #f3f3f1;
      text-decoration: none;
      background: #161618;
      border-radius: 2px;
      padding: 14px 12px;
      min-height: 84px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    a span {
      width: 28px;
      height: 28px;
      border-radius: 2px;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #0c0c0e;
    }
    a small { color: #b5b5b0; font-size: 13px; }
    .w { background: #e7e2d6; }
    .m { background: #d4652f; }
    .h { background: #d6b15a; }
  </style>
</head>
<body>
  <main>
    <div class="mark">S</div>
    <h1>Sledge</h1>
    <p>A quiet start page. Search, or pick a place to open.</p>
    <form action="https://www.google.com/search" method="get">
      <input name="q" placeholder="Search the web" autocomplete="off">
      <button type="submit">Go</button>
    </form>
    <div class="dials">
      <a href="https://en.wikipedia.org"><span class="w">W</span><small>Wikipedia</small></a>
      <a href="https://developer.mozilla.org"><span class="m">M</span><small>MDN</small></a>
      <a href="https://news.ycombinator.com"><span class="h">Y</span><small>Hacker News</small></a>
    </div>
  </main>
</body>
</html>
